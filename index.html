<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>DDR</title>
  <link rel="icon" href="/static/Distressed Metal Chevron with Chains.png" />
  <link rel="manifest" href="/manifest.json" />

  <script type="module" src="/player.js"></script>
  <script type="module" src="/genre_list.js"></script>



  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(34, 197, 94, 0.22), transparent 30%),
        radial-gradient(circle at 82% 85%, rgba(132, 204, 22, 0.16), transparent 35%),
        conic-gradient(from 210deg at 50% 50%, #020706, #071b12, #153b1c, #050a08, #0b2815, #020706);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: rgba(7, 20, 13, 0.88);
      border: 1px solid rgba(134, 239, 172, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 3rem 4rem;
      box-shadow: 0 25px 55px -12px rgba(0, 0, 0, 0.75), 0 0 45px rgba(34, 197, 94, 0.12);
      max-width: 600px;
      width: 100%;
      text-align: center;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 30px 65px -12px rgba(0, 0, 0, 0.85), 0 0 55px rgba(34, 197, 94, 0.2);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #f0fdf4;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .highlight {
      background: linear-gradient(135deg, #f0fdf4 10%, #86efac 50%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #bbf7d0;
      font-size: 1.0rem;
      line-height: 1.6;
      margin: 0.5rem 0 1.0rem;
    }

    .radioBrowserLink {
      color: #dcfce7;


    }

    .badge {
      display: inline-block;
      background: rgba(20, 83, 45, 0.75);
      border: 1px solid rgba(134, 239, 172, 0.35);
      color: #dcfce7;
      font-weight: 600;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      margin-top: 20px;
    }

    /* Buttons */
    .links {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }



    .dropdown-label {
      color: #dcfce7;
      font-weight: 600;
      text-align: left;
    }

    .dropdown {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 2px solid rgba(134, 239, 172, 0.35);
      border-radius: 0.8rem;
      background: rgba(2, 12, 7, 0.9);
      color: #f0fdf4;
      font: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .dropdown:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .btn {
      display: block;
      padding: 0.9rem 1.2rem;
      background: #46e546;
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.8rem;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #3a3665;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #86efac;
      border-top: 1px solid rgba(134, 239, 172, 0.18);
      padding-top: 1.5rem;
    }

    .footer span {
      font-weight: 500;
    }

    select {
      /* This works in some browsers */
      transform: rotate(0deg);
    }

    .favicon-set {
      max-width: 140px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .favicon-set:not([src]),
    .favicon-set[src=""] {
      display: none;
    }
  </style>
</head>

<body>


  <div class="card">
    <h2><span class="highlight">Drop Down <br>
        Radio Browser</span></h2>

    <!-- <p>This page is inspired by RadioBrowser.</p> -->
    <!-- <a class="radioBrowserLink" href="https://www.radio-browser.info/" target="_blank" rel="noopener noreferrer">
      This page is inspired by RadioBrowser.
    </a> -->
    <br>
    <div class="badge"><a class="radioBrowserLink" href="https://www.radio-browser.info/" target="_blank" rel="noopener noreferrer">
      This page is inspired by RadioBrowser.
    </a></div>

    <div class="links">
      <label class="dropdown-label" for="radio-options">Choose a server</label>
      <select class="dropdown" id="radio-options-server" name="radio-options">
        <option value=""></option>

      </select>
      <label class="dropdown-label" for="radio-options">Choose a metal genre</label>
      <select class="dropdown" id="radio-options-genre" name="radio-options">
        <option value=""></option>
        <!-- <option value="heavy_metal">Heavy</option>
        <option value="trash_metal">Trash</option>
        <option value="death_metal">Death</option>
        <option value="grind">Grind</option>
        <option value="metalcore">Metalcore</option>
        <option value="deathcore">Deathcore</option> -->

      </select>
      <label class="dropdown-label" for="radio-options">Choose a station</label>
      <select class="dropdown" id="radio-options-station" name="radio-options">
        <!-- <option value=""></option> -->


      </select>


      <img id="favicon" class="favicon-set" src="" alt="Selected station logo"></img>

      <audio id="player" controls autoplay loop preload="auto">
        <source src="" type="audio/mpeg">
      </audio>

      <!-- <a class="btn" href="/">🏠 Home</a>
      <a class="btn" href="/about">ℹ️ About</a>
      <a class="btn" href="/contact">📞 Contact</a>
      <a class="btn" href="/status">📡 API Status</a> -->
    </div>

    <div class="footer">

      <!-- <span>⚡</span> running on <span href="https://kqm3339npudw-production-nsqqfh44.europe-west1.suga.run/" target="_blank" rel="noopener noreferrer">https://kqm3339npudw-production-nsqqfh44.europe-west1.suga.run/</span> -->
    </div>
  </div>
  <script type="module" src="/app.js"></script>

  <script>
    const radioOtionsServer = document.getElementById('radio-options-server');
    const radioOtionsGenre = document.getElementById('radio-options-genre');
    const stationSelect = document.getElementById('radio-options-station');
    const favicon_element = document.getElementById('favicon');


    radioOtionsGenre.addEventListener('change', () => {

      fetch('/api/genre', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          server: radioOtionsServer.value,
          genre: radioOtionsGenre.value
        })
      })
        .then(res => {
          if (!res.ok) {
            throw new Error('Network response was not ok');
          }
          return res.json();
        })
        .then(data => {
          favicon_element.src = "";


          const select = document.getElementById('radio-options-station');

          select.innerHTML = '';

          data.result.forEach(station => {
            const station_data = {
              name: station.name,
              url: station.url_resolved || station.url || '',
              favicon: station.favicon || ''
            }
            const option = document.createElement('option');
            option.value = station_data.url;
            option.dataset.favicon = station_data.favicon || '';
            option.textContent = station_data.name;
            stationSelect.appendChild(option);


          });


        })
        .catch(error => console.error('Error:', error));
    })

    stationSelect.addEventListener('change', (e) => {

      favicon_element.src = "";
      const url = e.target.value;
      if (url) {
        const playerInstance = window.player;
        if (!playerInstance) {
          console.error('Audio player is not ready yet.');
          return;
        }

        const streamUrl = url.startsWith('http://') && window.location.protocol === 'https:'
          ? url.replace('http://', 'https://')
          : url;

        playerInstance.pause();
        playerInstance.src = streamUrl;
        playerInstance.load();

        const playPromise = playerInstance.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            console.warn('Playback was blocked until the user interacts with the page.');
          });
        }

        favicon_element.src = e.target.selectedOptions[0].dataset.favicon || '';
      }


    });








  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered', reg))
          .catch(err => console.log('SW error', err));
      });
    }
  </script>


</body>

</html>
